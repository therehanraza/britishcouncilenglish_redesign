services:
  - type: web
    name: britishcouncil-api
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGINS
        value: https://britishcouncilenglish-redesign.vercel.app
      - key: MONGO_URI
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
